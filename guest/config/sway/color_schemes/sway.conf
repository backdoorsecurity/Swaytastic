# Swaytastic palette. Included from $HOME/.config/sway/config.
# Qt pack: /usr/share/qt6ct/colors/Swaytastic.conf + qss/Swaytastic.qss. GTK theme: themes/Swaytastic.
# Keep hex values in sync when changing a color.

set $bg             #100909
set $bg_window      #100909
set $bg_bar         #100909
set $bg_inactive    #111111
set $fg             #99e01c
set $accent         #de1062
set $accent_dim     #6f0831
set $pink           #ff1e96
set $ws_focused_text #992545
set $indicator      #000010
set $child_border   $accent
