[ColorScheme]
# qt6ct QPalette roles, in order:
# WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
# ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText, Accent
# WindowText: default widget foreground
# Button: button fill; Chromium/Brave Qt native toolbar background
# Light/Midlight/Dark/Mid: 3D bevel colors derived around Button
# Text: foreground in text-entry widgets and views
# BrightText: foreground that contrasts with Dark
# ButtonText: foreground on buttons
# Base: text-entry, list, and view background
# Window: general window fill; Chromium/Brave Qt window background
# Shadow: drop-shadow color
# Highlight: selected-item fill; Chromium/Brave Qt tab strip / top bar
# HighlightedText: foreground on Highlight
# Link / LinkVisited: hyperlink foregrounds
# AlternateBase: alternating row fill in views
# ToolTipBase / ToolTipText: tooltip fill and foreground
# PlaceholderText: placeholder text in empty fields
# Accent: Qt 6 accent color
